name: Generate Photo Thumbnails

on:
  push:
    branches:
      - main
    paths:
      - "assets/images/photos/**"
      - "_data/photos.yml"
      - "scripts/generate_photo_thumbnails.sh"
      - ".github/workflows/generate-photo-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure ImageMagick is available
        run: |
          if command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate thumbnails
        run: bash scripts/generate_photo_thumbnails.sh

      - name: Commit updated thumbnails
        run: |
          if [ -z "$(git status --porcelain -- assets/images/photos/thumbnails)" ]; then
            echo "No thumbnail changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/photos/thumbnails
          git commit -m "chore: refresh photo thumbnails [skip ci]"
          git push
